<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Talentys · Back-office</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0A1328;--card:#111D3A;--line:#26335A;--txt:#EEF2F8;--mut:#93A1BE;--acc:#FF6414}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);padding:28px;width:100%;max-width:380px}
.box h1{margin-bottom:4px}
.box p{color:var(--mut);margin:0 0 20px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line);color:var(--txt);font:inherit}
input:focus{outline:2px solid var(--acc);outline-offset:0}
button{font:inherit;cursor:pointer;border:0;padding:11px 16px;background:var(--acc);color:#0A1328;font-weight:700}
button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:500}
button.danger{background:transparent;color:#ff7b7b;border:1px solid #5a2a2a;padding:5px 9px;font-size:13px}
button:disabled{opacity:.6;cursor:wait}
.box button{width:100%;margin-top:18px}
.err{color:#ff7b7b;margin-top:12px;font-size:14px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{width:240px}
.count{color:var(--mut);margin-bottom:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:820px;background:var(--card)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
a{color:var(--acc)}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.empty{padding:28px;text-align:center;color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.tab{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:12px 16px;text-align:left;font-weight:600;min-width:240px;flex:1;max-width:420px}
.tab small{display:block;font-weight:400;color:var(--mut);margin-top:2px}
.tab.on{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.tab b{color:var(--acc)}
.help{color:var(--mut);margin:8px 0 14px;font-size:14px}
tr.det td{white-space:normal;background:var(--bg);color:var(--mut);font-size:13.5px}
tr.det dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
tr.det dt{color:var(--txt)} tr.det dd{margin:0}
button.lnk{background:none;border:0;color:var(--acc);padding:0;font-weight:500;cursor:pointer}
</style>
</head>
<body>

<section class="login" id="viewLogin" hidden>
  <form class="box" id="formLogin">
    <h1>Back-office Talentys</h1>
    <p>Connecte-toi pour voir les candidatures.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pwd">Mot de passe</label>
    <input id="pwd" type="password" autocomplete="current-password" required>
    <button type="submit" id="btnLogin">Se connecter</button>
    <div class="err" id="loginErr" hidden></div>
  </form>
</section>

<section class="wrap" id="viewApp" hidden>
  <header>
    <h1>Back-office Talentys</h1>
    <div class="tools">
      <input id="q" type="search" placeholder="Rechercher…">
      <button class="ghost" id="btnRefresh">Actualiser</button>
      <button class="ghost" id="btnCsv">Export CSV</button>
      <button class="ghost" id="btnOut">Déconnexion</button>
    </div>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="candidats" role="tab">Candidats <b id="nCand"></b><small>Réponses du formulaire du site (page d'accueil talentys.info)</small></button>
    <button class="tab" data-tab="entreprises" role="tab">Entreprises <b id="nEnt"></b><small>Réponses du formulaire entreprises (talentys.info/entreprise)</small></button>
  </div>
  <p class="help" id="help"></p>
  <div class="count" id="count"></div>
  <div class="tablewrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Aucune réponse pour le moment.</div>
  </div>
  <div class="err" id="appErr" hidden></div>
</section>

<script>
const sb=supabase.createClient("https://kfjetzgjogktlgcvetbp.supabase.co","sb_publishable_WLPSnMC1_By6yQdpaluGeA_x-p6ddVi");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fdate=v=>new Date(v).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
const TABS={
  candidats:{
    table:"candidats",
    help:"Candidatures envoyées depuis le formulaire « Postuler » du site (page d'accueil talentys.info).",
    cols:["Date","Nom","Téléphone","Email","Âge","Niveau","Parent","CV"],
    csv:["created_at","prenom","nom","tel","email","age","niveau","parent_ok","cv_path"],
    search:r=>[r.prenom,r.nom,r.email,r.tel,r.niveau],
    row:r=>'<td>'+esc(fdate(r.created_at))+'</td><td><b>'+esc(r.prenom)+' '+esc(r.nom)+'</b></td>'+
      '<td><a href="tel:'+esc(r.tel)+'">'+esc(r.tel)+'</a></td><td><a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a></td>'+
      '<td>'+esc(r.age)+'</td><td>'+(r.niveau?'<span class="tag">'+esc(r.niveau)+'</span>':'')+'</td><td>'+(r.parent_ok?'Oui':'')+'</td>'+
      '<td>'+(r.cv_path?'<a href="#" data-cv="'+esc(r.cv_path)+'">Ouvrir</a>':'')+'</td>'
  },
  entreprises:{
    table:"entreprises",
    help:"Demandes de recrutement envoyées depuis le formulaire entreprises (talentys.info/entreprise).",
    cols:["Date","Entreprise","Contact","Téléphone","Email","Poste(s)","Nombre","Démarrage","Code postal","Aide estimée"],
    csv:["created_at","entreprise","siret","taille","prenom","nom","fonction","tel","email","postes","secteur","nombre","demarrage","cp","jour","criteres","qualites","precisions","rdv","aide","source","campagne"],
    search:r=>[r.entreprise,r.prenom,r.nom,r.email,r.tel,r.postes,r.cp,r.secteur],
    row:r=>'<td>'+esc(fdate(r.created_at))+'</td><td><b>'+esc(r.entreprise)+'</b>'+(r.taille?' <span class="tag">'+esc(r.taille)+'</span>':'')+'</td>'+
      '<td>'+esc(r.prenom)+' '+esc(r.nom)+(r.fonction?'<br><span style="color:var(--mut)">'+esc(r.fonction)+'</span>':'')+'</td>'+
      '<td><a href="tel:'+esc(r.tel)+'">'+esc(r.tel)+'</a></td><td><a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a></td>'+
      '<td>'+esc(r.postes)+'</td><td>'+esc(r.nombre)+'</td><td>'+esc(r.demarrage)+'</td><td>'+esc(r.cp)+'</td><td>'+esc(r.aide)+'</td>',
    detail:r=>{const f=[["SIRET",r.siret],["Secteur",r.secteur],["Jour d'école souhaité",r.jour],["Critères",r.criteres],["Qualités",r.qualites],["Précisions",r.precisions],["Rencontre",r.rdv],["Source",r.source],["Campagne",r.campagne]].filter(x=>x[1]);
      return f.length?'<dl>'+f.map(x=>'<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>').join("")+'</dl>':'Aucun détail supplémentaire.';}
  }
};
let cur="candidats", DATA={candidats:[],entreprises:[]};

function show(logged){ $("#viewLogin").hidden=logged; $("#viewApp").hidden=!logged; }

$("#formLogin").addEventListener("submit",async e=>{
  e.preventDefault(); const err=$("#loginErr"), b=$("#btnLogin"); err.hidden=true; b.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#pwd").value});
  b.disabled=false;
  if(error){ err.textContent="Email ou mot de passe incorrect."; err.hidden=false; return; }
  $("#pwd").value=""; await start();
});
$("#btnOut").addEventListener("click",async()=>{ await sb.auth.signOut(); DATA={candidats:[],entreprises:[]}; show(false); });
$("#btnRefresh").addEventListener("click",load);
$("#q").addEventListener("input",render);
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  cur=b.dataset.tab; document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===b)); $("#q").value=""; render();
}));

async function load(){
  const err=$("#appErr"); err.hidden=true;
  const res=await Promise.all(Object.keys(TABS).map(k=>sb.from(TABS[k].table).select("*").order("created_at",{ascending:false})));
  const bad=res.find(r=>r.error);
  if(bad){ err.textContent="Erreur de chargement : "+bad.error.message; err.hidden=false; }
  Object.keys(TABS).forEach((k,i)=>{ if(!res[i].error) DATA[k]=res[i].data; });
  render();
}
function filtered(){
  const q=$("#q").value.trim().toLowerCase(), T=TABS[cur];
  return !q?DATA[cur]:DATA[cur].filter(r=>T.search(r).join(" ").toLowerCase().includes(q));
}
function render(){
  const T=TABS[cur], list=filtered();
  $("#nCand").textContent="("+DATA.candidats.length+")"; $("#nEnt").textContent="("+DATA.entreprises.length+")";
  $("#help").textContent=T.help;
  $("#thead").innerHTML="<tr>"+T.cols.map(c=>"<th>"+c+"</th>").join("")+(T.detail?"<th>Détails</th>":"")+"<th></th></tr>";
  $("#count").textContent=list.length+" réponse"+(list.length>1?"s":"")+(list.length!==DATA[cur].length?" (sur "+DATA[cur].length+")":"");
  $("#empty").hidden=list.length>0;
  $("#rows").innerHTML=list.map(r=>'<tr>'+T.row(r)+(T.detail?'<td><button class="lnk" data-det="'+esc(r.id)+'">Voir</button></td>':'')+
    '<td><button class="danger" data-del="'+esc(r.id)+'">Supprimer</button></td></tr>'+
    (T.detail?'<tr class="det" id="det-'+esc(r.id)+'" hidden><td colspan="'+(T.cols.length+2)+'">'+T.detail(r)+'</td></tr>':'')).join("");
}
$("#rows").addEventListener("click",async e=>{
  const cv=e.target.closest("[data-cv]");
  if(cv){ e.preventDefault();
    const {data,error}=await sb.storage.from("cv").createSignedUrl(cv.dataset.cv,60);
    if(error) return alert("CV introuvable : "+error.message);
    window.open(data.signedUrl,"_blank","noopener"); return; }
  const det=e.target.closest("[data-det]");
  if(det){ const row=$("#det-"+det.dataset.det); row.hidden=!row.hidden; det.textContent=row.hidden?"Voir":"Masquer"; return; }
  const del=e.target.closest("[data-del]");
  if(del){
    if(!confirm("Supprimer cette réponse ? Action irréversible.")) return;
    const {error}=await sb.from(TABS[cur].table).delete().eq("id",del.dataset.del);
    if(error) return alert("Suppression impossible : "+error.message);
    await load();
  }
});
$("#btnCsv").addEventListener("click",()=>{
  const cols=TABS[cur].csv;
  const cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const csv="\ufeff"+[cols.join(";")].concat(filtered().map(r=>cols.map(c=>cell(r[c])).join(";"))).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=cur+"-"+new Date().toISOString().slice(0,10)+".csv"; a.click();
});

async function start(){ show(true); await load(); }
(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session) start(); else show(false);
})();
</script>
